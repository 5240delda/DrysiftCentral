<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050807">
  <meta name="description" content="DrysiftCentral — officielle links">
  <title>DRYSIFTCENTRAL — Official Links</title>
  <style>
    :root { --neon: #00f5a0; --bg: #050807; --panel: #101216; --muted: #9aa3a8; }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0; min-height: 100vh; color: #f5f7f6; background-color: var(--bg);
      background-image: linear-gradient(rgba(0,245,160,.035) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,245,160,.035) 1px, transparent 1px),
                        radial-gradient(ellipse at 50% 20%, rgba(0,245,160,.12), transparent 42%);
      background-size: 58px 58px, 58px 58px, auto;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100% - 32px, 620px); margin: 0 auto; padding: 48px 0 64px; text-align: center; }
    .logo-wrap {
      width: 184px; height: 184px; margin: 8px auto 28px; border-radius: 50%; padding: 5px;
      background: var(--neon); box-shadow: 0 0 18px rgba(0,245,160,.55), 0 0 54px rgba(0,245,160,.18);
    }
    .logo-wrap img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; background: #000; }
    h1 { margin: 0; font-size: clamp(1.7rem, 6vw, 2.45rem); line-height: 1.15; font-weight: 850; letter-spacing: .025em; }
    .subtitle { margin: 16px 0 34px; color: var(--muted); font-size: clamp(1rem, 3.8vw, 1.2rem); }
    a { color: inherit; text-decoration: none; }
    .button {
      display: flex; align-items: center; justify-content: center; gap: 13px;
      width: 100%; min-height: 78px; margin: 0 0 18px; padding: 18px 20px;
      border: 1px solid #25292e; border-radius: 19px; background: var(--panel);
      font-size: clamp(1.08rem, 4.2vw, 1.38rem); font-weight: 600; letter-spacing: .015em;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .button:hover, .button:focus-visible { transform: translateY(-2px); border-color: var(--neon); box-shadow: 0 0 18px rgba(0,245,160,.12); outline: none; }
    .button.primary {
      min-height: 92px; margin-bottom: 30px; color: #00150d; background: linear-gradient(110deg, #00f5a0, #00c986);
      border: 0; border-radius: 19px; text-transform: uppercase; font-weight: 850;
      box-shadow: 0 10px 34px rgba(0,245,160,.23);
    }
    .icon { width: 30px; flex: 0 0 30px; font-size: 1.45rem; }
    footer { margin-top: 30px; color: #65706d; font-size: .82rem; letter-spacing: .12em; }
    @media (max-width: 420px) { main { padding-top: 34px; } .logo-wrap { width: 160px; height: 160px; } .button { min-height: 70px; border-radius: 16px; } }
  </style>
</head>
<body>
  <main>
    <div class="logo-wrap"><img src="logo.jpeg" alt="DrysiftCentral-logo"></div>
    <h1>DRYSIFTCENTRAL<br>OFFICIAL LINKS</h1>

    <a class="button primary" href="https://streamable.com/c/vscoon" target="_blank" rel="noopener noreferrer">
      <span class="icon">📋</span><span>VIEW PHOTO MENU</span>
    </a>
    <a class="button" href="https://t.me/Jackjack448" target="_blank" rel="noopener noreferrer">
      <span class="icon">📲</span><span>Telegram</span>
    </a>
    <a class="button" href="https://signal.me/#eu/UWttlPgIyXcD4Tw6EypN6SvRUVb9SfjgnHQtoyG3gUOvUPZfQLlJgYA5RSk4BDNM" target="_blank" rel="noopener noreferrer">
      <span class="icon">🌐</span><span>Signal</span>
    </a>
    <a class="button" href="https://www.instagram.com/drysift.central1312/" target="_blank" rel="noopener noreferrer">
      <span class="icon">📸</span><span>Instagram</span>
    </a>
    <footer>DRYSIFTCENTRAL · OFFICIAL LINKS</footer>
  </main>
</body>
</html>
